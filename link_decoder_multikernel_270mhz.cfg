# Four-CU decoder control plane. All CUs share one 270 MHz clock and each CU
# is confined to the SLR containing its private DDR bank. Only neighbour AXIS
# links cross SLR boundaries.
freqhz=270000000:pe0.ap_clk,pe1.ap_clk,pe2.ap_clk,pe3.ap_clk

[connectivity]
nk=int4_decoder_pe0_kernel:1:pe0
nk=int4_decoder_pe1_kernel:1:pe1
nk=int4_decoder_pe2_kernel:1:pe2
nk=int4_decoder_pe3_kernel:1:pe3

slr=pe0:SLR0
slr=pe1:SLR1
slr=pe2:SLR2
slr=pe3:SLR3

sp=pe0.m_axi_gmem0:DDR[0]
sp=pe1.m_axi_gmem1:DDR[1]
sp=pe2.m_axi_gmem2:DDR[2]
sp=pe3.m_axi_gmem3:DDR[3]

# SLR0 <-> SLR1: PE0 partials and completed local outputs.
sc=pe0.rms_partial_to_pe1:pe1.rms_partial_from_pe0
sc=pe1.rms_reciprocal_to_pe0:pe0.rms_reciprocal_from_pe1
sc=pe0.linear_partial_to_pe1:pe1.linear_partial_from_pe0
sc=pe1.linear_output_to_pe0:pe0.linear_output_from_pe1

# SLR1 <-> SLR2: the only central pair-reduction exchange.
sc=pe2.rms_sum_to_pe1:pe1.rms_sum_from_pe2
sc=pe1.rms_reciprocal_to_pe2:pe2.rms_reciprocal_from_pe1
sc=pe1.linear_sum_to_pe2:pe2.linear_sum_from_pe1
sc=pe2.linear_sum_to_pe1:pe1.linear_sum_from_pe2

# SLR2 <-> SLR3: PE3 partials and completed local outputs.
sc=pe3.rms_partial_to_pe2:pe2.rms_partial_from_pe3
sc=pe2.rms_reciprocal_to_pe3:pe3.rms_reciprocal_from_pe2
sc=pe3.linear_partial_to_pe2:pe2.linear_partial_from_pe3
sc=pe2.linear_output_to_pe3:pe3.linear_output_from_pe2

[vivado]
prop=run.impl_1.STEPS.PLACE_DESIGN.ARGS.DIRECTIVE=SSI_SpreadSLLs
prop=run.impl_1.STEPS.PHYS_OPT_DESIGN.IS_ENABLED=true
prop=run.impl_1.STEPS.PHYS_OPT_DESIGN.ARGS.DIRECTIVE=AggressiveExplore
prop=run.impl_1.STEPS.ROUTE_DESIGN.ARGS.DIRECTIVE=Explore
prop=run.impl_1.STEPS.POST_ROUTE_PHYS_OPT_DESIGN.IS_ENABLED=true
prop=run.impl_1.STEPS.POST_ROUTE_PHYS_OPT_DESIGN.ARGS.DIRECTIVE=AggressiveExplore
