freqhz=300000000:int4_decoder_token_controller_1.ap_clk

[connectivity]
# Keep each AXI master on the DDR channel physically associated with the PE
# assigned to the same-numbered SLR by timing_300mhz_pre_place.tcl.
sp=int4_decoder_token_controller_1.m_axi_gmem0:DDR[0]
sp=int4_decoder_token_controller_1.m_axi_gmem1:DDR[1]
sp=int4_decoder_token_controller_1.m_axi_gmem2:DDR[2]
sp=int4_decoder_token_controller_1.m_axi_gmem3:DDR[3]

[vivado]
# Wide routing and control ownership are expressed in the HLS hierarchy and
# the source-controlled SLR assignments below.  Do not hide a new architectural
# fanout regression with a global synthesis FANOUT_LIMIT.
# Vitis 2023.2 forwards the pre-place Tcl path into a generated Vivado project,
# where a relative path can silently miss the workspace Tcl.  Keep the checked-in
# config executable by resolving the placeholders immediately before v++ is
# invoked. Do not pass this template directly to v++; use build_300mhz.ps1 on
# Windows or build_300mhz.sh on Linux.
prop=run.impl_1.STEPS.PLACE_DESIGN.TCL.PRE=__TIMING_PRE_PLACE_TCL__
prop=run.impl_1.STEPS.PLACE_DESIGN.TCL.POST=__TIMING_POST_PLACE_TCL__
prop=run.impl_1.strategy=Performance_WLBlockPlacementFanoutOpt
prop=run.impl_1.STEPS.PHYS_OPT_DESIGN.IS_ENABLED=true
prop=run.impl_1.STEPS.PHYS_OPT_DESIGN.ARGS.DIRECTIVE=AggressiveExplore
prop=run.impl_1.STEPS.POST_ROUTE_PHYS_OPT_DESIGN.IS_ENABLED=true
prop=run.impl_1.STEPS.POST_ROUTE_PHYS_OPT_DESIGN.ARGS.DIRECTIVE=AggressiveExplore
