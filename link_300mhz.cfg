freqhz=300000000:int4_decoder_token_controller_1.ap_clk

[connectivity]
# Keep the four top-kernel AXI master bundles on their corresponding DDR banks.
sp=int4_decoder_token_controller_1.m_axi_gmem0:DDR[0]
sp=int4_decoder_token_controller_1.m_axi_gmem1:DDR[1]
sp=int4_decoder_token_controller_1.m_axi_gmem2:DDR[2]
sp=int4_decoder_token_controller_1.m_axi_gmem3:DDR[3]

[vivado]
# The build wrapper resolves this placeholder to the DDR/control interface
# locality floorplan immediately before invoking v++.
prop=run.impl_1.STEPS.PLACE_DESIGN.TCL.PRE=__TIMING_PRE_PLACE_TCL__
# The router reported localized SLL demand above 100% on the SLR2/SLR3
# boundary.  Spread crossings during placement, then use the timing-focused
# implementation directives before and after routing.
prop=run.impl_1.STEPS.PLACE_DESIGN.ARGS.DIRECTIVE=SSI_SpreadSLLs
prop=run.impl_1.STEPS.PHYS_OPT_DESIGN.IS_ENABLED=true
prop=run.impl_1.STEPS.PHYS_OPT_DESIGN.ARGS.DIRECTIVE=AggressiveExplore
prop=run.impl_1.STEPS.ROUTE_DESIGN.ARGS.DIRECTIVE=Explore
prop=run.impl_1.STEPS.POST_ROUTE_PHYS_OPT_DESIGN.IS_ENABLED=true
prop=run.impl_1.STEPS.POST_ROUTE_PHYS_OPT_DESIGN.ARGS.DIRECTIVE=AggressiveExplore
