<svg xmlns="http://www.w3.org/2000/svg" width="900" height="950" viewBox="0 0 900 950" role="img">
  <defs>
    <style>
      .title { font: 700 24px 'Segoe UI', Arial, sans-serif; fill: #0f172a; text-anchor: middle; }
      .text-large { font: 600 13px 'Segoe UI', Arial, sans-serif; fill: #475569; }
      .text-box { font: 600 15px 'Segoe UI', Arial, sans-serif; fill: #0f172a; text-anchor: middle; dominant-baseline: middle; }
      .text-box-sub { font: 400 12px 'Segoe UI', Arial, sans-serif; fill: #475569; text-anchor: middle; dominant-baseline: middle; }
      
      /* Luồng chính */
      .line { stroke: #64748b; stroke-width: 2; fill: none; marker-end: url(#arrow); }
      
      /* Đường nối bypass: nét liền, mỏng hơn (1.5px) */
      .line-bypass { stroke: #64748b; stroke-width: 1.5; fill: none; marker-end: url(#arrow-small); }
      
      /* Bảng 3 màu chủ đạo */
      .box-primary { fill: #dbeafe; stroke: #93c5fd; stroke-width: 2; rx: 6; } /* Xanh dương */
      .box-accent { fill: #ffedd5; stroke: #fdba74; stroke-width: 2; rx: 6; }  /* Cam nhạt */
      .box-neutral { fill: #f8fafc; stroke: #cbd5e1; stroke-width: 2; rx: 6; } /* Xám/Trắng */
      
      .box-decoder { fill: none; stroke: #64748b; stroke-width: 2; stroke-dasharray: 6,4; rx: 12; }
    </style>
    
    <!-- Đầu mũi tên chuẩn -->
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L6,3 z" fill="#64748b"/>
    </marker>
    
    <!-- Đầu mũi tên nhỏ cho đường mỏng -->
    <marker id="arrow-small" markerWidth="6" markerHeight="6" refX="5" refY="2.5" orient="auto">
      <path d="M0,0 L0,5 L5,2.5 z" fill="#64748b"/>
    </marker>
  </defs>

  <!-- Nền trắng -->
  <rect width="100%" height="100%" fill="#ffffff" />

  <!-- Tiêu đề sơ đồ -->
  <text x="450" y="45" class="title">Transformer Architecture Overview (Llama 2-7B)</text>

  <!-- Input Token IDs -->
  <rect x="275" y="80" width="350" height="50" class="box-neutral"/>
  <text x="450" y="105" class="text-box">Input token IDs</text>

  <path d="M450 130 L450 170" class="line"/>

  <!-- Token Embedding -->
  <rect x="275" y="170" width="350" height="65" class="box-primary"/>
  <text x="450" y="195" class="text-box">Token embedding</text>
  <text x="450" y="215" class="text-box-sub">Vocab 32,000 → 4096 dimensions</text>

  <path d="M450 235 L450 320" class="line"/>

  <!-- Decoder Layer Container (×32) -->
  <rect x="220" y="275" width="460" height="400" class="box-decoder"/>
  <text x="235" y="300" class="text-large">Decoder layer × 32</text>

  <!-- RMSNorm 1 -->
  <rect x="255" y="320" width="390" height="45" class="box-neutral"/>
  <text x="450" y="342" class="text-box">RMSNorm</text>

  <path d="M450 365 L450 395" class="line"/>

  <!-- Grouped-query attention -->
  <rect x="255" y="395" width="390" height="65" class="box-primary"/>
  <text x="450" y="420" class="text-box">Grouped-query attention</text>
  <text x="450" y="440" class="text-box-sub">+ RoPE · 32 heads / 8 KV heads</text>

  <path d="M450 460 L450 490" class="line"/>

  <!-- Add (residual) 1 -->
  <rect x="255" y="490" width="390" height="40" class="box-neutral"/>
  <text x="450" y="510" class="text-box">Add (residual)</text>

  <path d="M450 530 L450 560" class="line"/>

  <!-- RMSNorm 2 -->
  <rect x="255" y="560" width="390" height="45" class="box-neutral"/>
  <text x="450" y="582" class="text-box">RMSNorm</text>

  <path d="M450 605 L450 635" class="line"/>

  <!-- SwiGLU FFN -->
  <rect x="255" y="635" width="390" height="65" class="box-accent"/>
  <text x="450" y="660" class="text-box">SwiGLU FFN</text>
  <text x="450" y="680" class="text-box-sub">4096 → 11,008 → 4096 dimensions</text>

  <path d="M450 700 L450 725" class="line"/>

  <!-- Add (residual) 2 -->
  <rect x="255" y="725" width="390" height="40" class="box-neutral"/>
  <text x="450" y="745" class="text-box">Add (residual)</text>

  <!-- Residual bypass 1 (Nhánh trái, nối từ trục giữa sang trái, bên trên chữ) -->
  <path d="M 450 260 L 160 260 L 160 510 L 255 510" class="line-bypass"/>

  <!-- Residual bypass 2 (Nhánh phải, nối từ trục giữa sang phải) -->
  <path d="M 450 545 L 740 545 L 740 745 L 645 745" class="line-bypass"/>

  <!-- Out of decoder box connections -->
  <path d="M450 765 L450 800" class="line"/>

  <!-- Final RMSNorm -->
  <rect x="275" y="800" width="350" height="50" class="box-neutral"/>
  <text x="450" y="825" class="text-box">Final RMSNorm</text>

  <path d="M450 850 L450 880" class="line"/>

  <!-- LM Head -->
  <rect x="275" y="880" width="350" height="65" class="box-primary"/>
  <text x="450" y="905" class="text-box">LM head (linear)</text>
  <text x="450" y="925" class="text-box-sub">4096 → 32,000 dimensions</text>

</svg>
