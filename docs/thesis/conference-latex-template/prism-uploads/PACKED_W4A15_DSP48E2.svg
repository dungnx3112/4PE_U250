<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Two-lane packed W4A15 arithmetic on one DSP48E2</title>
  <desc id="desc">Four panels show signed INT4 weight packing with a 23-bit shift, shared DSP48E2 multiplication by one signed A15 activation, G32 packed accumulation in a 46-bit accumulator, and sign-corrected extraction of two independent 23-bit dot products.</desc>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="#334155"/></marker>
    <marker id="arrowRed" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="#dc2626"/></marker>
    <style>
      text{font-family:'Segoe UI',Arial,sans-serif;fill:#0f172a}
      .panel{fill:#fff;stroke:#94a3b8;stroke-width:1.8}
      .blue{fill:#eff6ff;stroke:#2563eb;stroke-width:1.8}
      .purple{fill:#f5f3ff;stroke:#7c3aed;stroke-width:1.8}
      .green{fill:#f0fdf4;stroke:#16a34a;stroke-width:1.8}
      .orange{fill:#fff7ed;stroke:#ea580c;stroke-width:1.8}
      .red{fill:#fff1f2;stroke:#dc2626;stroke-width:1.8}
      .gray{fill:#f8fafc;stroke:#94a3b8;stroke-width:1.5}
      .h1{font-size:21px;font-weight:700}
      .h2{font-size:18px;font-weight:700}
      .label{font-size:16px;font-weight:650}
      .small{font-size:14px;font-weight:500;fill:#475569}
      .tiny{font-size:12px;font-weight:500;fill:#64748b}
      .bit{font-size:13px;font-weight:650;text-anchor:middle}
      .center{text-anchor:middle}
      .flow{fill:none;stroke:#334155;stroke-width:2.3;marker-end:url(#arrow)}
      .correction{fill:none;stroke:#dc2626;stroke-width:3;marker-end:url(#arrowRed)}
      .wire{fill:none;stroke:#475569;stroke-width:2}
    </style>
  </defs>
  <rect width="1600" height="900" fill="#fff"/>

  <!-- Panel a -->
  <rect x="30" y="30" width="750" height="380" rx="12" class="panel"/>
  <text x="55" y="66" class="h1">(a)</text>
  <text x="405" y="66" class="h1 center">Signed weight packing</text>
  <rect x="92" y="105" width="178" height="58" rx="8" class="red"/>
  <rect x="538" y="105" width="178" height="58" rx="8" class="purple"/>
  <text x="181" y="129" class="label center">w<tspan baseline-shift="sub" font-size="12">h,k</tspan></text>
  <text x="181" y="150" class="small center">signed INT4</text>
  <text x="627" y="129" class="label center">w<tspan baseline-shift="sub" font-size="12">l,k</tspan></text>
  <text x="627" y="150" class="small center">signed INT4</text>

  <text x="116" y="207" class="tiny">26</text><text x="246" y="207" class="tiny">23</text>
  <text x="264" y="207" class="tiny">22</text><text x="548" y="207" class="tiny">4</text>
  <text x="566" y="207" class="tiny">3</text><text x="696" y="207" class="tiny">0</text>
  <rect x="110" y="218" width="150" height="72" class="red"/>
  <rect x="260" y="218" width="300" height="72" class="gray"/>
  <rect x="560" y="218" width="150" height="72" class="purple"/>
  <text x="185" y="249" class="bit">w<tspan baseline-shift="sub" font-size="10">h,k</tspan></text>
  <text x="185" y="272" class="tiny center">4 bits</text>
  <text x="410" y="249" class="bit">19-bit guard region</text>
  <text x="410" y="272" class="tiny center">23-bit shift including low lane</text>
  <text x="635" y="249" class="bit">w<tspan baseline-shift="sub" font-size="10">l,k</tspan></text>
  <text x="635" y="272" class="tiny center">4 bits</text>
  <path d="M181 163 V208" class="flow"/><path d="M627 163 V208" class="flow"/>
  <rect x="190" y="325" width="430" height="52" rx="8" class="blue"/>
  <text x="405" y="358" class="h2 center">w<tspan baseline-shift="sub" font-size="12">p,k</tspan> = (w<tspan baseline-shift="sub" font-size="12">h,k</tspan> &lt;&lt; 23) + w<tspan baseline-shift="sub" font-size="12">l,k</tspan>  · signed 27-bit</text>

  <!-- Panel b -->
  <rect x="820" y="30" width="750" height="380" rx="12" class="panel"/>
  <text x="845" y="66" class="h1">(b)</text>
  <text x="1195" y="66" class="h1 center">Shared DSP multiplication</text>
  <rect x="870" y="118" width="245" height="66" rx="8" class="blue"/>
  <text x="992" y="145" class="label center">packed weight w<tspan baseline-shift="sub" font-size="12">p,k</tspan></text>
  <text x="992" y="168" class="small center">signed 27-bit</text>
  <rect x="870" y="233" width="245" height="66" rx="8" class="orange"/>
  <text x="992" y="260" class="label center">activation x<tspan baseline-shift="sub" font-size="12">k</tspan></text>
  <text x="992" y="283" class="small center">signed A15 → 18-bit input</text>
  <rect x="1215" y="147" width="270" height="120" rx="10" fill="#eff6ff" stroke="#1d4ed8" stroke-width="3"/>
  <text x="1350" y="195" class="h1 center">DSP48E2</text>
  <text x="1350" y="226" class="h2 center">27 × 18 MULT</text>
  <path d="M1115 151 H1215" class="flow"/><path d="M1115 266 H1170 V235 H1215" class="flow"/>
  <path d="M1485 207 H1534" class="flow"/>
  <text x="1508" y="188" class="small center">packed</text><text x="1508" y="238" class="small center">product</text>
  <rect x="1000" y="325" width="390" height="48" rx="24" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="1195" y="355" class="h2 center">1 DSP48E2 → 2 W4 × A15 products</text>

  <!-- Panel c -->
  <rect x="30" y="450" width="750" height="420" rx="12" class="panel"/>
  <text x="55" y="486" class="h1">(c)</text>
  <text x="405" y="486" class="h1 center">G32 packed accumulation</text>
  <rect x="105" y="525" width="600" height="58" rx="8" class="blue"/>
  <text x="405" y="561" class="h2 center">A<tspan baseline-shift="sub" font-size="12">p</tspan> = Σ<tspan baseline-shift="sub" font-size="12">k=0</tspan><tspan baseline-shift="super" font-size="12">31</tspan> w<tspan baseline-shift="sub" font-size="12">p,k</tspan>x<tspan baseline-shift="sub" font-size="12">k</tspan> = 2<tspan baseline-shift="super" font-size="12">23</tspan>D<tspan baseline-shift="sub" font-size="12">h</tspan> + D<tspan baseline-shift="sub" font-size="12">l</tspan></text>
  <path d="M405 583 V625" class="flow"/>
  <text x="122" y="637" class="tiny">45</text><text x="384" y="637" class="tiny">23</text><text x="411" y="637" class="tiny">22</text><text x="686" y="637" class="tiny">0</text>
  <rect x="115" y="648" width="290" height="105" class="red"/>
  <rect x="405" y="648" width="290" height="105" class="purple"/>
  <text x="260" y="693" class="h2 center">upper lane D<tspan baseline-shift="sub" font-size="12">h</tspan></text>
  <text x="260" y="723" class="label center">23 bits</text>
  <text x="550" y="693" class="h2 center">lower lane D<tspan baseline-shift="sub" font-size="12">l</tspan></text>
  <text x="550" y="723" class="label center">23 bits</text>
  <text x="405" y="786" class="small center">46-bit packed accumulator · 23-bit spacing prevents lane overlap</text>
  <rect x="190" y="815" width="430" height="34" rx="6" class="gray"/>
  <text x="405" y="838" class="small center">32 products accumulated in one packed datapath</text>

  <!-- Panel d -->
  <rect x="820" y="450" width="750" height="420" rx="12" class="panel"/>
  <text x="845" y="486" class="h1">(d)</text>
  <text x="1195" y="486" class="h1 center">Lane extraction and sign correction</text>
  <rect x="1040" y="520" width="310" height="55" rx="8" class="gray"/>
  <text x="1195" y="554" class="h2 center">A<tspan baseline-shift="sub" font-size="12">p</tspan>[45:0]</text>
  <path d="M1195 575 V610 H1000 V640" class="flow"/>
  <path d="M1195 610 H1390 V640" class="flow"/>

  <rect x="865" y="640" width="270" height="68" rx="8" class="purple"/>
  <text x="1000" y="670" class="label center">D<tspan baseline-shift="sub" font-size="12">l</tspan> = A<tspan baseline-shift="sub" font-size="12">p</tspan>[22:0]</text>
  <text x="1000" y="694" class="small center">signed 23-bit low lane</text>
  <rect x="1255" y="640" width="270" height="68" rx="8" class="red"/>
  <text x="1390" y="670" class="label center">D<tspan baseline-shift="sub" font-size="12">h,raw</tspan> = A<tspan baseline-shift="sub" font-size="12">p</tspan>[45:23]</text>
  <text x="1390" y="694" class="small center">raw signed high lane</text>

  <rect x="900" y="748" width="160" height="54" rx="8" class="red"/>
  <text x="980" y="780" class="label center">D<tspan baseline-shift="sub" font-size="12">l</tspan>[22]</text>
  <path d="M1000 708 V748" class="correction"/>
  <rect x="1220" y="742" width="310" height="66" rx="8" class="green"/>
  <text x="1375" y="772" class="label center">D<tspan baseline-shift="sub" font-size="12">h</tspan> = D<tspan baseline-shift="sub" font-size="12">h,raw</tspan> + D<tspan baseline-shift="sub" font-size="12">l</tspan>[22]</text>
  <text x="1375" y="795" class="small center">signed 23-bit high dot product</text>
  <path d="M1390 708 V742" class="flow"/>
  <path d="M1060 775 H1220" class="correction"/>

  <rect x="860" y="830" width="280" height="34" rx="7" class="green"/>
  <text x="1000" y="853" class="small center">D<tspan baseline-shift="sub" font-size="10">l</tspan> · independent G32 dot product</text>
  <rect x="1235" y="830" width="280" height="34" rx="7" class="green"/>
  <text x="1375" y="853" class="small center">D<tspan baseline-shift="sub" font-size="10">h</tspan> · independent G32 dot product</text>
  <path d="M865 674 H835 V847 H860" class="flow"/>
</svg>
