<svg xmlns="http://www.w3.org/2000/svg" width="800" height="1080" viewBox="0 0 800 1080">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#475569"/></marker>
    <style>
      .title{font:700 27px Arial,sans-serif;fill:#0f172a;text-anchor:middle}
      .head{font:700 18px Arial,sans-serif;fill:#0f172a;text-anchor:middle}
      .body{font:400 14px Arial,sans-serif;fill:#334155;text-anchor:middle}
      .small{font:400 12px Arial,sans-serif;fill:#475569;text-anchor:middle}
      .box{stroke-width:2.2;rx:14}
      .arrow{stroke:#475569;stroke-width:2.2;fill:none;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="800" height="1080" fill="#fff"/>
  <text x="400" y="42" class="title">WEIGHT QUANTIZATION AND DDR PACKING</text>

  <rect x="150" y="78" width="500" height="82" class="box" fill="#e0f2fe" stroke="#0284c7"/>
  <text x="400" y="106" class="head">Floating-point projection matrix W</text>
  <text x="400" y="132" class="body">Partition into hardware tiles Wᵢ of 128 output rows × 256 columns</text>
  <path d="M400 160 L400 202" class="arrow"/>

  <rect x="110" y="206" width="580" height="118" class="box" fill="#ede9fe" stroke="#7c3aed"/>
  <text x="400" y="235" class="head">Symmetric tile-wise INT4 quantization</text>
  <text x="400" y="266" class="body">S<tspan baseline-shift="sub" font-size="11">w,i</tspan> = max |Wᵢ| / 7</text>
  <text x="400" y="292" class="body">Ŵᵢ = clip(round(Wᵢ / S<tspan baseline-shift="sub" font-size="11">w,i</tspan>), −7, 7)</text>
  <text x="400" y="313" class="small">one FP16 scale per 128 × 256 tile</text>
  <path d="M400 324 L400 366" class="arrow"/>

  <rect x="78" y="370" width="644" height="142" class="box" fill="#dcfce7" stroke="#16a34a"/>
  <text x="400" y="399" class="head">Reorder into PE consumption order</text>
  <text x="400" y="427" class="body">Each 512-bit word: four output rows × 32 INT4 input positions</text>
  <rect x="130" y="451" width="540" height="35" rx="7" fill="#fff" stroke="#16a34a" stroke-width="1.5"/>
  <text x="197" y="474" class="small">row 0 / G32</text><text x="332" y="474" class="small">row 1 / G32</text>
  <text x="467" y="474" class="small">row 2 / G32</text><text x="602" y="474" class="small">row 3 / G32</text>
  <path d="M265 452 L265 486 M400 452 L400 486 M535 452 L535 486" stroke="#94a3b8" stroke-width="1.2"/>
  <text x="400" y="503" class="small">256 consecutive 512-bit words per tile</text>
  <path d="M400 512 L400 554" class="arrow"/>

  <rect x="100" y="558" width="600" height="116" class="box" fill="#fef3c7" stroke="#d97706"/>
  <text x="400" y="588" class="head">Round-robin output-tile assignment</text>
  <text x="400" y="616" class="body">tile row r → PE (r mod 4)</text>
  <text x="400" y="647" class="body">PE0: 0,4,…   PE1: 1,5,…   PE2: 2,6,…   PE3: 3,7,…</text>
  <path d="M400 674 L400 716" class="arrow"/>

  <text x="400" y="746" class="head">Four independent bank-local DDR images</text>
  <g>
    <rect x="45" y="774" width="165" height="218" class="box" fill="#eff6ff" stroke="#2563eb"/>
    <rect x="227" y="774" width="165" height="218" class="box" fill="#f0fdf4" stroke="#16a34a"/>
    <rect x="408" y="774" width="165" height="218" class="box" fill="#fffbeb" stroke="#d97706"/>
    <rect x="590" y="774" width="165" height="218" class="box" fill="#faf5ff" stroke="#9333ea"/>
    <text x="127" y="805" class="head">DDR0</text><text x="309" y="805" class="head">DDR1</text>
    <text x="490" y="805" class="head">DDR2</text><text x="672" y="805" class="head">DDR3</text>
    <g fill="#fff" stroke="#94a3b8" stroke-width="1.2">
      <rect x="62" y="827" width="131" height="43" rx="6"/><rect x="244" y="827" width="131" height="43" rx="6"/>
      <rect x="425" y="827" width="131" height="43" rx="6"/><rect x="607" y="827" width="131" height="43" rx="6"/>
      <rect x="62" y="884" width="131" height="81" rx="6"/><rect x="244" y="884" width="131" height="81" rx="6"/>
      <rect x="425" y="884" width="131" height="81" rx="6"/><rect x="607" y="884" width="131" height="81" rx="6"/>
    </g>
    <text x="127" y="845" class="body">FP16 scales</text><text x="127" y="860" class="small">metadata region</text>
    <text x="309" y="845" class="body">FP16 scales</text><text x="309" y="860" class="small">metadata region</text>
    <text x="490" y="845" class="body">FP16 scales</text><text x="490" y="860" class="small">metadata region</text>
    <text x="672" y="845" class="body">FP16 scales</text><text x="672" y="860" class="small">metadata region</text>
    <text x="127" y="912" class="body">INT4 tile</text><text x="127" y="934" class="body">payloads</text><text x="127" y="955" class="small">256-word bursts</text>
    <text x="309" y="912" class="body">INT4 tile</text><text x="309" y="934" class="body">payloads</text><text x="309" y="955" class="small">256-word bursts</text>
    <text x="490" y="912" class="body">INT4 tile</text><text x="490" y="934" class="body">payloads</text><text x="490" y="955" class="small">256-word bursts</text>
    <text x="672" y="912" class="body">INT4 tile</text><text x="672" y="934" class="body">payloads</text><text x="672" y="955" class="small">256-word bursts</text>
  </g>
  <text x="400" y="1030" class="body">Separated metadata prevents scale reads from fragmenting the main weight stream</text>
</svg>