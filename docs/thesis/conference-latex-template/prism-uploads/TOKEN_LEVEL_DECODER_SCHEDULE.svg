<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="820" viewBox="0 0 1600 820" role="img" aria-labelledby="title desc">
  <title id="title">Eight-state fused token-level decoder schedule</title>
  <desc id="desc">Exactly eight controller states are arranged around a vertical residual backbone. Attention states one through five and feed-forward states six through eight return through local fused residual-add nodes. Final normalization and vocabulary projection remain outside the repeated decoder layer.</desc>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="#334155"/></marker>
    <marker id="arrowRed" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="#dc2626"/></marker>
    <style>
      text{font-family:'Segoe UI',Arial,sans-serif;fill:#0f172a}
      .enclosure{fill:#fff;stroke:#64748b;stroke-width:1.8;stroke-dasharray:9 7}
      .stateBox{fill:#fff;stroke:#64748b;stroke-width:1.6}
      .blue{fill:#eff6ff;stroke:#2563eb;stroke-width:1.7}
      .purple{fill:#f5f3ff;stroke:#7c3aed;stroke-width:1.7}
      .orange{fill:#fff7ed;stroke:#ea580c;stroke-width:1.7}
      .green{fill:#f0fdf4;stroke:#16a34a;stroke-width:1.7}
      .red{fill:#fff1f2;stroke:#dc2626;stroke-width:2}
      .gray{fill:#f8fafc;stroke:#94a3b8;stroke-width:1.5}
      .h1{font-size:20px;font-weight:700}
      .h2{font-size:17px;font-weight:700}
      .label{font-size:14px;font-weight:650}
      .small{font-size:12.5px;font-weight:500;fill:#475569}
      .tiny{font-size:11.5px;font-weight:600;fill:#64748b}
      .center{text-anchor:middle}
      .flow{fill:none;stroke:#334155;stroke-width:2.4;marker-end:url(#arrow)}
      .backbone{fill:none;stroke:#334155;stroke-width:5;stroke-linecap:round}
      .bypass{fill:none;stroke:#dc2626;stroke-width:3;marker-end:url(#arrowRed)}
      .control{fill:none;stroke:#64748b;stroke-width:1.5;stroke-dasharray:6 6;marker-end:url(#arrow)}
      .state{fill:#334155;stroke:#fff;stroke-width:2}
      .stateText{font-size:12px;font-weight:700;fill:#fff;text-anchor:middle}
      .fused{fill:#fff1f2;stroke:#dc2626;stroke-width:1.2}
    </style>
  </defs>
  <rect width="1600" height="820" fill="#fff"/>

  <rect x="45" y="45" width="1510" height="610" rx="14" class="enclosure"/>
  <rect x="70" y="65" width="220" height="38" rx="19" class="gray"/>
  <text x="180" y="90" class="h2 center">Decoder layer × 32</text>

  <!-- Vertical residual backbone -->
  <path d="M145 130 V575" class="backbone"/>
  <circle cx="145" cy="155" r="7" fill="#334155"/>
  <circle cx="145" cy="340" r="7" fill="#334155"/>
  <circle cx="145" cy="505" r="7" fill="#334155"/>
  <text x="72" y="137" class="small">input residual</text>
  <path d="M72 155 H138" class="flow"/>

  <!-- Attention branch -->
  <text x="205" y="130" class="h2">Attention sublayer</text>
  <path d="M145 155 H205" class="flow"/>

  <!-- State 1: orange norm/quant + blue Q -->
  <rect x="210" y="150" width="230" height="110" rx="9" class="stateBox"/>
  <rect x="210" y="150" width="230" height="60" rx="9" class="orange"/>
  <rect x="210" y="210" width="230" height="50" rx="0" class="blue"/>
  <circle cx="225" cy="165" r="13" class="state"/><text x="225" y="170" class="stateText">1</text>
  <text x="325" y="181" class="label center">RMSNorm + A15/G32</text>
  <text x="325" y="233" class="label center">Q projection · W4A15</text>

  <rect x="475" y="150" width="145" height="110" rx="9" class="blue"/>
  <circle cx="490" cy="165" r="13" class="state"/><text x="490" y="170" class="stateText">2</text>
  <text x="548" y="195" class="label center">K projection</text>
  <text x="548" y="222" class="small center">W4A15</text>

  <rect x="655" y="150" width="145" height="110" rx="9" class="blue"/>
  <circle cx="670" cy="165" r="13" class="state"/><text x="670" y="170" class="stateText">3</text>
  <text x="728" y="195" class="label center">V projection</text>
  <text x="728" y="222" class="small center">W4A15</text>

  <!-- State 4: purple attention + orange output normalization -->
  <rect x="835" y="150" width="310" height="110" rx="9" class="stateBox"/>
  <rect x="835" y="150" width="310" height="66" rx="9" class="purple"/>
  <rect x="835" y="216" width="310" height="44" class="orange"/>
  <circle cx="850" cy="165" r="13" class="state"/><text x="850" y="170" class="stateText">4</text>
  <text x="990" y="178" class="label center">RoPE + compressed-KV SwiftKV</text>
  <text x="990" y="201" class="small center">single-pass online attention</text>
  <text x="990" y="243" class="small center">normalize + A15/G32 output quantize</text>

  <!-- State 5: projection + residual add -->
  <rect x="1180" y="150" width="245" height="110" rx="9" class="stateBox"/>
  <rect x="1180" y="150" width="245" height="72" rx="9" class="blue"/>
  <rect x="1180" y="222" width="245" height="38" class="fused"/>
  <circle cx="1195" cy="165" r="13" class="state"/><text x="1195" y="170" class="stateText">5</text>
  <text x="1302" y="187" class="label center">O projection · W4A15</text>
  <text x="1302" y="246" class="small center">fused residual add</text>

  <path d="M440 205 H475 M620 205 H655 M800 205 H835 M1145 205 H1180" class="flow"/>
  <path d="M1425 205 H1470 V320 H165" class="flow"/>

  <!-- Local attention residual bypass and add node on backbone -->
  <path d="M145 162 V313" class="bypass"/>
  <circle cx="145" cy="320" r="22" class="red"/>
  <path d="M134 320 H156 M145 309 V331" stroke="#dc2626" stroke-width="2.3"/>

  <!-- FFN branch -->
  <text x="205" y="390" class="h2">Feed-forward sublayer</text>
  <path d="M145 400 H205" class="flow"/>

  <!-- State 6: norm/quant + Gate -->
  <rect x="210" y="410" width="300" height="110" rx="9" class="stateBox"/>
  <rect x="210" y="410" width="300" height="60" rx="9" class="orange"/>
  <rect x="210" y="470" width="300" height="50" class="blue"/>
  <circle cx="225" cy="425" r="13" class="state"/><text x="225" y="430" class="stateText">6</text>
  <text x="360" y="441" class="label center">RMSNorm + A15/G32</text>
  <text x="360" y="493" class="label center">Gate projection · W4A15</text>

  <rect x="550" y="410" width="180" height="110" rx="9" class="blue"/>
  <circle cx="565" cy="425" r="13" class="state"/><text x="565" y="430" class="stateText">7</text>
  <text x="640" y="455" class="label center">Up projection</text>
  <text x="640" y="482" class="small center">W4A15</text>

  <!-- State 8: SwiGLU/quant + Down + residual add -->
  <rect x="770" y="410" width="490" height="110" rx="9" class="stateBox"/>
  <rect x="770" y="410" width="215" height="110" rx="9" class="orange"/>
  <rect x="985" y="410" width="185" height="110" class="blue"/>
  <rect x="1170" y="410" width="90" height="110" class="fused"/>
  <circle cx="785" cy="425" r="13" class="state"/><text x="785" y="430" class="stateText">8</text>
  <text x="878" y="448" class="label center">SwiGLU</text>
  <text x="878" y="476" class="small center">+ A15/G32</text>
  <text x="1078" y="448" class="label center">Down projection</text>
  <text x="1078" y="476" class="small center">W4A15</text>
  <text x="1215" y="447" class="small center">fused</text>
  <text x="1215" y="470" class="small center">residual</text>
  <text x="1215" y="493" class="small center">add</text>

  <path d="M510 465 H550 M730 465 H770" class="flow"/>
  <path d="M1260 465 H1390 V555 H165" class="flow"/>

  <!-- Local FFN residual bypass and add node -->
  <path d="M145 407 V548" class="bypass"/>
  <circle cx="145" cy="555" r="22" class="red"/>
  <path d="M134 555 H156 M145 544 V566" stroke="#dc2626" stroke-width="2.3"/>

  <!-- Controller sequencing -->
  <path d="M325 125 H548 H728 H990 H1302" class="control"/>
  <path d="M360 385 H640 H1015" class="control"/>
  <text x="1360" y="126" class="tiny">controller sequence</text>

  <rect x="520" y="580" width="520" height="42" rx="21" class="green"/>
  <text x="780" y="606" class="label center">Residual and intermediate vectors retained in BRAM/URAM</text>

  <!-- Outside repeated decoder -->
  <path d="M145 577 V715 H350" class="flow"/>
  <rect x="360" y="680" width="220" height="70" rx="9" class="orange"/>
  <text x="470" y="709" class="label center">Final RMSNorm</text>
  <text x="470" y="733" class="small center">after layer 31</text>
  <rect x="655" y="680" width="250" height="70" rx="9" class="blue"/>
  <text x="780" y="709" class="label center">Vocabulary projection</text>
  <text x="780" y="733" class="small center">4096 → 32000</text>
  <rect x="980" y="680" width="210" height="70" rx="9" class="gray"/>
  <text x="1085" y="709" class="label center">Striped logits</text>
  <text x="1085" y="733" class="small center">four DDR banks</text>
  <rect x="1280" y="680" width="200" height="70" rx="9" class="gray"/>
  <text x="1380" y="709" class="label center">Host</text>
  <text x="1380" y="733" class="small center">sampling loop</text>
  <path d="M580 715 H655 M905 715 H980 M1190 715 H1280" class="flow"/>
</svg>
